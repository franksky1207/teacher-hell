name: Story tooling checks
on:
  push:
    branches: [content/events-production-v1]
    paths: &tooling
      - '.github/workflows/story-production-v1-focused.yml'
      - '.nvmrc'
      - 'package.json'
      - 'scripts/*story*'
      - 'story-reader/**'
      - 'test/story-*.test.js'
      - 'data/story-production-selected-seeds-T1-001-030.json'
      - 'docs/事件四數值三層平衡種子2400組.md'
      - 'docs/T1-T6-特定故事20主題與觸發日期.md'
      - 'src/calendar/**'
  pull_request:
    branches: [main]
    paths: *tooling
  workflow_dispatch:

permissions:
  contents: read

jobs:
  story-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          node --check story-reader/reader.js
          node --test test/story-draft-validator.test.js test/story-state-matrix.test.js test/story-reader-export.test.js test/story-reader-ui.test.js test/story-production-catalog.test.js test/story-preview-multipage.test.js test/story-preview-snapshot.test.js test/story-preview-cast-continuity.test.js test/story-preview-t1-006-010.test.js
