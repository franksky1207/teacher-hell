name: Targeted portrait width-height audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/portrait-width-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install image decoder
        run: python -m pip install --quiet Pillow numpy
      - name: Check all 240 alpha-visible character rectangles
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path("web/assets/characters/students")
          count=0
          missing=[]
          width_exceeds_height=[]
          width_caps=[]
          extreme=[]
          ratios=[.91,.99,.85,.96,.93,.90,.89,.93,.90,.87,.97,.83,.98,.90,1,.94,.91,.86,.93,.94,.87,.94,.79,.90,.84,.88,.93,.91,.90,.87,.82,.94,.86,.90,.84,.95,.86,.89,.80,.89]
          for n in range(1,41):
            id=f"student-{n:03d}"
            path=root/id/f"{id}-full-sheet-uniform-summer.png"
            if not path.is_file():
              missing.append(id)
              continue
            img=Image.open(path).convert("RGBA")
            if img.width % 3 or img.height % 2:
              raise SystemExit(f"Invalid grid {id}: {img.size}")
            cw,ch=img.width//3,img.height//2
            ratios_s=[]
            for k in range(6):
              cell=img.crop(((k%3)*cw,(k//3)*ch,(k%3+1)*cw,(k//3+1)*ch))
              alpha=cell.getchannel('A')
              # JS: every other pixel, alpha >= 96.
              import numpy as np
              a=np.asarray(alpha)
              ys,xs=np.where(a[::2,::2]>=96)
              if not len(xs):
                raise SystemExit(f"No visible image {id} cell {k+1}")
              width=int(xs.max()-xs.min()+1)*2
              height=int(ys.max()-ys.min()+1)*2
              count+=1
              if width>height:width_exceeds_height.append((id,k+1,width,height))
              ratios_s.append((width,height))
              if 1000*ratios[n-1]*width/height>1000+1e-8:width_caps.append((id,k+1,width,height,round(1000*ratios[n-1]*width/height,2)))
            extreme.append((id,max(round(w/h,5) for w,h in ratios_s),min(h for w,h in ratios_s),max(w for w,h in ratios_s)))
            print("CHARACTER",id,"max_width_to_height",round(max(w/h for w,h in ratios_s),4),"width_range",min(w for w,h in ratios_s),max(w for w,h in ratios_s),"height_range",min(h for w,h in ratios_s),max(h for w,h in ratios_s))
          print("AUDIT_SUMMARY",{"files":40-len(missing),"cells":count,"missing":missing,"width_gt_height":width_exceeds_height,"width_cap_triggered":width_caps,"max_ratio":max((x[1] for x in extreme),default=None)})
          if missing or count!=240 or width_exceeds_height or width_caps:raise SystemExit(1)
          PY
