name: Publish story reader
on:
  workflow_dispatch:
  push:
    branches: [content/events-production-v1, main]
    paths:
      - 'content/events-v1/T/**/*.md'
      - 'content/events-v1/G/**/*.md'
      - 'content/events-v1/P/**/*.md'
      - 'story-reader/**'
      - 'scripts/story-catalog.js'
      - 'scripts/export-story-reader.mjs'
      - 'scripts/deploy-story-reader.sh'
      - '.github/workflows/story-reader-publish.yml'

permissions:
  contents: write
concurrency:
  group: teacher-hell-story-reader-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == (vars.STORY_READER_SOURCE_BRANCH || 'content/events-production-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Configure publication identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish reader and Markdown snapshot
        run: bash scripts/deploy-story-reader.sh "${GITHUB_REF_NAME}"
      - name: Verify the published reader snapshot
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_SHA=$(git rev-parse HEAD)
          base="https://franksky1207.github.io/teacher-hell/stories"
          for attempt in $(seq 1 30); do
            export RELEASE_JSON=$(curl -fsSL --max-time 10 "$base/release.json?source=$SOURCE_SHA&attempt=$attempt" || true)
            export INDEX_JSON=$(curl -fsSL --max-time 10 "$base/data/index.json?source=$SOURCE_SHA&attempt=$attempt" || true)
            if node -e '
              try {
                const r=JSON.parse(process.env.RELEASE_JSON),i=JSON.parse(process.env.INDEX_JSON);
                if(r.sourceCommit===process.env.SOURCE_SHA && i.sourceCommit===r.sourceCommit &&
                   i.sourceBranch===process.env.GITHUB_REF_NAME && i.count===r.count &&
                   i.stories.length===i.count) process.exit(0);
              } catch {}
              process.exit(1);
            '; then
              echo "Verified Pages story snapshot $SOURCE_SHA"
              exit 0
            fi
            sleep 10
          done
          echo 'Pages has not served the current story snapshot.' >&2
          exit 1
