name: 18-B 390 reviewed publication focused verification
on:
  push:
    branches:
      - feat/18b-release-390-reviewed
  pull_request:
    paths:
      - 'src/runtime/story-content.js'
      - 'src/runtime/progression.js'
      - 'test/18b-reviewed-publication.test.js'
permissions:
  contents: read
jobs:
  review390:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Official 390-event publication, isolation and progression
        run: node --test --test-isolation=none test/18b-reviewed-publication.test.js test/18b-controller-content-disposition.test.js test/18b-c-t01-t02-integration.test.js
      - name: School-year boundary and progression-only regression
        run: node --test --test-isolation=none --test-name-pattern='H5 (controller|frozen senior summer|ordered formal controller)' test/progression.test.js
