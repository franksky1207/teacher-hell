name: Build student-001 summer six-expression sheet
on:
  push:
    branches: [main]
    paths:
      - scripts/build-student001-summer-faces.py
      - .github/workflows/phase15-summer-face-build.yml
permissions:
  contents: write
concurrency:
  group: teacher-hell-summer-face-build
  cancel-in-progress: false
jobs:
  build-summer-face-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install imaging requirements only
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Build verified summer Sprite Sheet and metadata
        run: python scripts/build-student001-summer-faces.py
      - name: Enable summer preview only after successful image generation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/student-art-preview.js')
          code=p.read_text(encoding='utf-8')
          before="'uniform-winter':'full','uniform-summer':'base'"
          after="'uniform-winter':'full','uniform-summer':'full'"
          if before not in code and after not in code:
              raise SystemExit('preview catalog does not match expected baseline')
          code=code.replace(before,after)
          source='const normalized=normalizeSixExpressionCanvas(loadedBase,loadedSheet,loadedMeta);'
          replacement="const normalized=(wear==='uniform-summer') ? {canvas:loadedSheet} : normalizeSixExpressionCanvas(loadedBase,loadedSheet,loadedMeta);"
          if source not in code and replacement not in code:
              raise SystemExit('cannot identify face-sheet normalization location')
          code=code.replace(source,replacement)
          code=code.replace("const name=STUDENT_ART_EXPRESSIONS.find(([key])=>key===current)?.[1]??current;","const name=STUDENT_ART_EXPRESSIONS.find(([key])=>key===current)?.[1]??current;")
          p.write_text(code,encoding='utf-8')
          PY
      - name: Commit only new summer assets and preview catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/characters/students/student-001/student-001-face-sheet-uniform-summer.png
          git add web/assets/characters/students/student-001/student-001-face-sheet-uniform-summer.json
          git add web/student-art-preview.js
          git diff --cached --quiet || (git commit -m "art: build student-001 summer six-expression candidate" && git push origin HEAD:main)
