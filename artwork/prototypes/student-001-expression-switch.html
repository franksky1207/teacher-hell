<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>student-001 六表情交叉淡化原型（僅開發驗證）</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#172132;color:#f4f3f1;font:16px/1.6 system-ui,"Noto Sans TC",sans-serif}
main{max-width:800px;margin:auto;padding:16px}h1{font-size:1.2rem;margin:0 0 8px}p{margin:5px 0 10px;color:#ccd5df}
.stage{position:relative;height:min(62vh,650px);min-height:340px;overflow:hidden;border-radius:12px;background:linear-gradient(#6a8791,#242e46);isolation:isolate}
.figure{position:absolute;inset:0;display:grid;place-items:end center;pointer-events:none}
.figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;opacity:0;transition:opacity 180ms ease-in-out;will-change:opacity}
.figure img.is-visible{opacity:1}.figure img.base-img{opacity:1;transition:none;will-change:auto}
.caption{position:absolute;bottom:0;left:0;right:0;background:#10182ddc;padding:10px 16px;color:white;z-index:1}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.controls button{font:inherit;padding:7px 12px;cursor:pointer;color:white;border:1px solid #c5c6d0;background:#2b3a56;border-radius:8px}
.controls button[aria-pressed=true]{background:#536b89;border-color:white}
.controls button:focus-visible{outline:3px solid #f4d99f;outline-offset:2px}
.status{font-size:.86rem;color:#cbd6da;min-height:1.5rem}
@media(max-width:600px){.stage{height:63dvh;min-height:280px}.controls button{flex:1 1 28%;font-size:.9rem}}
@media(prefers-reduced-motion:reduce){.figure img{transition-duration:0ms}}
</style>
</head>
<body>
<main>
<h1>student-001｜六表情原地交叉淡化測試</h1>
<p>僅驗證兩張 PNG 原地疊放與表情更換；不接正式人物 ID、事件、存檔或顯示層。</p>
<div class="stage" aria-label="人物表情原型">
  <div class="figure">
    <img id="fixed-base" class="base-img" src="../masters/students/student-001-base.png" alt="" decoding="async">
    <img id="layer-0" src="../masters/students/student-001-base.png" alt="" decoding="async">
    <img id="layer-1" src="../masters/students/student-001-base.png" alt="" decoding="async">
  </div>
  <div class="caption" id="caption">平靜｜人物保持固定位置</div>
</div>
<div class="controls" role="group" aria-label="選擇表情">
<button data-expression="calm" aria-pressed="true">平靜</button>
<button data-expression="happy" aria-pressed="false">開心</button>
<button data-expression="surprised" aria-pressed="false">驚訝</button>
<button data-expression="angry" aria-pressed="false">生氣</button>
<button data-expression="sad" aria-pressed="false">難過</button>
<button data-expression="embarrassed" aria-pressed="false">尷尬</button>
</div>
<p class="status" id="status" role="status">交叉淡化：約 180 ms；僅切換表情，不重設人物容器。</p>
</main>
<script>
(()=>{'use strict';
const names={calm:'平靜',happy:'開心',surprised:'驚訝',angry:'生氣',sad:'難過',embarrassed:'尷尬'};
const pathFor=key=>key==='calm'?'../masters/students/student-001-base.png':`student-001-expression-${key}.png`;
const layers=[document.querySelector('#layer-0'),document.querySelector('#layer-1')];
const caption=document.querySelector('#caption'),status=document.querySelector('#status');
let current='calm',front=0,generation=0;
const cache=new Map();cache.set('calm',Promise.resolve(true));
const load=key=>{if(!cache.has(key)){const image=new Image();image.decoding='async';image.src=pathFor(key);cache.set(key,new Promise(resolve=>{if(image.complete)resolve(image.naturalWidth>0);else {image.onload=()=>resolve(true);image.onerror=()=>resolve(false)}}))}return cache.get(key)};
for(const key of Object.keys(names))void load(key);
async function switchTo(key){
 if(!Object.hasOwn(names,key)||key===current)return;
 const own=++generation;
 status.textContent='正在讀取 '+names[key]+'…';
 if(!await load(key)){if(own===generation)status.textContent='圖片載入失敗，維持前一表情';return}
 if(own!==generation)return;
 // Rapid clicks coalesce into the latest state. Keep one persistent figure container.
 const incoming=1-front,outgoing=front;
 // Fixed calm base never fades: identical hair, body and uniform remain visually solid.
 layers[outgoing].src=pathFor(current);
 layers[outgoing].style.transition='none';
 layers[outgoing].classList.toggle('is-visible',current!=='calm');
 layers[incoming].src=pathFor(key);
 layers[incoming].style.transition='none';
 layers[incoming].classList.remove('is-visible');
 void layers[incoming].offsetWidth;
 layers[outgoing].style.transition='';
 layers[incoming].style.transition='';
 layers[incoming].classList.toggle('is-visible',key!=='calm');
 layers[outgoing].classList.remove('is-visible');
 current=key;front=incoming;
 caption.textContent=names[key]+'｜人物保持固定位置';
 document.querySelectorAll('button[data-expression]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.expression===key)));
 status.textContent='已切換至 '+names[key]+'；無整體重進場動畫';
}
document.querySelector('.controls').addEventListener('click',e=>{const button=e.target.closest('button[data-expression]');if(button)switchTo(button.dataset.expression)});
})();
</script>
</body>
</html>
