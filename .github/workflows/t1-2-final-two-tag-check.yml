name: T1-2 final two label evidence checks
on:
  push:
    branches: [content/events-production-v1]
    paths: ['.github/workflows/t1-2-final-two-tag-check.yml']
permissions:
  contents: read
jobs:
  label-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check final T1-032 and T1-046 story SHA, labels and official evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const root='content/events-v1/T/T1-高一上/T1-2-高中新生適應/';
          for(const [id,batch] of [['T1-032','T1-031-035'],['T1-046','T1-046-050']]){
            const j=JSON.parse(fs.readFileSync(root+'驗收紀錄/'+batch+'-正式驗收紀錄.json','utf8'));
            const x=j.records.find(r=>r.story_id===id);
            if(!x)throw Error('missing '+id);
            const sha=execFileSync('git',['hash-object',root+'單一池/'+id+'.md'],{encoding:'utf8'}).trim();
            if(sha!==x.source_blob_sha)throw Error('stale '+id);
            fs.writeFileSync('/tmp/'+id+'.json',JSON.stringify(x.review));
            console.log(id+' version PASS');
          }
          NODE
          for id in T1-032 T1-046; do
            node scripts/check-story-production.mjs audit "$id" --evidence "/tmp/$id.json" > "/tmp/$id.out"
            echo "$id formal CLI PASS"
          done
