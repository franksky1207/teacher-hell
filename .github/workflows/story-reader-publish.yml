name: Publish story reader
on:
  workflow_dispatch:
  push:
    branches: [content/events-production-v1, main]
    paths:
      - 'content/events-v1/T/**/*.md'
      - 'content/events-v1/G/**/*.md'
      - 'content/events-v1/P/**/*.md'
      - 'story-reader/**'
      - 'src/runtime/story-text.js'
      - 'src/world/school-subjects.js'
      - 'scripts/story-catalog.js'
      - 'scripts/export-story-reader.mjs'
      - 'scripts/deploy-story-reader.sh'
      - '.github/workflows/story-reader-publish.yml'

permissions:
  contents: write
  pages: write
concurrency:
  group: teacher-hell-story-reader-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == (vars.STORY_READER_SOURCE_BRANCH || 'content/events-production-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify every exported story can play
        run: node --test test/story-preview-catalog-playback.test.js
      - name: Configure publication identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish reader and Markdown snapshot
        run: bash scripts/deploy-story-reader.sh "${GITHUB_REF_NAME}"
      # GITHUB_TOKEN pushes do not start a legacy Pages build. Request it explicitly.
      - name: Request Pages build for the published subtree
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify the published reader snapshot
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_SHA=$(git rev-parse HEAD)
          base="https://franksky1207.github.io/teacher-hell/stories"
          release_file="$(mktemp)"
          index_file="$(mktemp)"
          trap 'rm -f "$release_file" "$index_file"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsSL --max-time 10 "$base/release.json?source=$SOURCE_SHA&attempt=$attempt" -o "$release_file" || true
            curl -fsSL --max-time 10 "$base/data/index.json?source=$SOURCE_SHA&attempt=$attempt" -o "$index_file" || true
            if node -e '
              const fs=require("node:fs");
              try {
                const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                const i=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
                if(r.sourceCommit===process.env.SOURCE_SHA &&
                   i.sourceCommit===r.sourceCommit &&
                   i.sourceBranch===process.env.GITHUB_REF_NAME &&
                   i.count===r.count &&
                   Array.isArray(i.stories) && i.stories.length===i.count) process.exit(0);
              } catch {}
              process.exit(1);
            ' "$release_file" "$index_file"; then
              echo "Verified Pages story snapshot $SOURCE_SHA"
              exit 0
            fi
            sleep 10
          done
          echo 'Pages has not served the current story snapshot.' >&2
          exit 1
