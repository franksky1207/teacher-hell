name: 18-B T03 isolated draft focused verification
on:
  workflow_dispatch:
    inputs:
      event_ids:
        description: Optional comma-separated T03 IDs for an affected-event recheck
        type: string
        required: false
  push:
    branches:
      - feat/18b-t03-content-production-20261116
      - feat/18b-t03-lossless-integration-20261116
    paths:
      - 'work/18b-t03-verification-trigger.md'
      - 'test/18b-t03-isolated-authoring.test.js'
      - '.github/workflows/phase18b-t03-drafts.yml'
permissions:
  contents: read
jobs:
  t03-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Select actual changed event payloads for PR77
        env:
          REQUESTED_IDS: ${{ inputs.event_ids }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          let ids=process.env.REQUESTED_IDS??'';
          if(!ids&&process.env.GITHUB_REF_NAME==='feat/18b-t03-lossless-integration-20261116'){
            ids=JSON.parse(fs.readFileSync('work/18b-t03-reconciliation/t03-held-triage-01-04.json','utf8')).verificationScope.eventIds.join(',');
          }
          if(ids&&!/^content:18b-t03-0[1-8]-\d+(,content:18b-t03-0[1-8]-\d+)*$/.test(ids))throw Error('Invalid event ID selection');
          if(process.env.GITHUB_REF_NAME==='feat/18b-t03-lossless-integration-20261116'&&!ids)throw Error('PR77 requires an explicit changed-event scope');
          fs.appendFileSync(process.env.GITHUB_ENV,'T03_EVENT_IDS='+ids+'\n');
          console.log(ids?'Scoped event IDs: '+ids:'Legacy source branch verification');
          JS
      - name: Source-to-JS serialization check
        run: |
          if [ -n "$T03_EVENT_IDS" ]; then
            node scripts/sync-t03-drafts.mjs --check --ids "$T03_EVENT_IDS"
          else
            node scripts/sync-t03-drafts.mjs --check
          fi
      - name: T03 isolated story contract and exploration boundary
        run: |
          if [ -n "$T03_EVENT_IDS" ]; then
            node --test --test-isolation=none --test-name-pattern='T03 (engineering drafts preserve|story compiler|reconciliation)' test/18b-t03-isolated-authoring.test.js
          else
            node --test --test-isolation=none test/18b-t03-isolated-authoring.test.js test/18b-t03-draft-contract.test.js test/18b-t03-content-disposition.test.js
          fi
