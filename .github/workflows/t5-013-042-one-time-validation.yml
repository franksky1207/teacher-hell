name: T5 013-042 one-time Node validation
on:
  pull_request:
    branches:
      - content/events-production-v1
  push:
    branches:
      - work/t5-013-042-drafts-20261124
    paths:
      - '.github/workflows/t5-013-042-one-time-validation.yml'
      - 'content/events-v1/T/T5-高三上/**'
  workflow_dispatch:
jobs:
  t5-node-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run 30 draft full validations
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 13 42); do
            id=$(printf 'T5-%03d' "$i")
            if [ "$i" -le 27 ]; then
              dir="T5-2-最後一次運動會"
            else
              dir="T5-3-最後一次校慶（高三不擺攤）"
            fi
            path="content/events-v1/T/T5-高三上/$dir/活動前/$id.md"
            echo "::group::$id full"
            npm run content:draft-check -- --input "$path" --stage full
            echo "::endgroup::"
          done
      - name: Full catalog production audit
        shell: bash
        run: |
          set -euo pipefail
          npm run content:production -- audit > /tmp/t5-production-audit.log 2>&1 || { tail -n 110 /tmp/t5-production-audit.log; exit 1; }
          echo "PASS: full catalog audit"
          tail -n 6 /tmp/t5-production-audit.log
