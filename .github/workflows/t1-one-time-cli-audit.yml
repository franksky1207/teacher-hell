name: T1 one-time CLI acceptance
on:
  push:
    branches: [content/events-production-v1]
    paths:
      - '.github/workflows/t1-one-time-cli-audit.yml'
permissions:
  contents: read
jobs:
  t1-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify T1-001 through T1-030 in one catalog audit
        shell: bash
        run: |
          node scripts/check-story-production.mjs audit > /tmp/t1-catalog-audit.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('/tmp/t1-catalog-audit.json','utf8'));
          const ids=Array.from({length:30},(_,i)=>'T1-'+String(i+1).padStart(3,'0'));
          const rows=ids.map(id=>report.reports.find(x=>x.storyId===id));
          const bad=ids.filter((id,i)=>!rows[i]||!rows[i].mechanicalPass);
          console.log('T1: '+(30-bad.length)+'/30 mechanicalPass, catalog issues='+report.issues.length);
          if(bad.length){console.log('FAIL:',bad.join(','));for(const id of bad){const r=rows[ids.indexOf(id)];console.log(id,JSON.stringify(r?.errors||r?.issues||r).slice(0,1400))}process.exitCode=1}
          NODE
      - name: Validate the 18 stored story-review evidence objects
        shell: bash
        run: |
          mkdir -p /tmp/t1-evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='content/events-v1/T/T1-高一上/T1-1-首次進班與建班/驗收紀錄/';
          for(const file of ['T1-013-018-正式驗收紀錄.json','T1-019-024-正式驗收紀錄.json','T1-025-030-正式驗收紀錄.json']){
            const content=JSON.parse(fs.readFileSync(base+file,'utf8'));
            for(const item of content.records){
              const id=item.story_id||item.id;
              if(!/^T1-0(?:1[3-9]|2[0-9]|30)$/.test(id))throw Error('unexpected story '+id);
              fs.writeFileSync('/tmp/t1-evidence/'+id+'.json',JSON.stringify(item.review));
            }
          }
          NODE
          failed=0
          for n in $(seq 13 30); do
            id=$(printf 'T1-%03d' "$n")
            if node scripts/check-story-production.mjs audit "$id" --evidence "/tmp/t1-evidence/$id.json" > "/tmp/t1-evidence/$id.result" 2> "/tmp/t1-evidence/$id.err"; then
              echo "$id evidence PASS"
            else
              echo "$id evidence FAIL"
              cat "/tmp/t1-evidence/$id.err"
              failed=$((failed+1))
            fi
          done
          echo "Evidence: $((18-failed))/18 passed"
          test "$failed" -eq 0
