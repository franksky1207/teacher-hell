name: T1 first twelve one-time evidence acceptance
on:
  push:
    branches: [content/events-production-v1]
    paths:
      - '.github/workflows/t1-first12-one-time-evidence.yml'
permissions:
  contents: read
jobs:
  t1-first-twelve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check all twelve current story reviews with the official CLI
        shell: bash
        run: |
          mkdir -p /tmp/t1-first12-evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root='content/events-v1/T/T1-高一上/T1-1-首次進班與建班/驗收紀錄/';
          let count=0;
          for(const filename of ['T1-001-004-正式驗收紀錄.json','T1-005-008-正式驗收紀錄.json','T1-009-012-正式驗收紀錄.json']){
            const data=JSON.parse(fs.readFileSync(root+filename,'utf8'));
            for(const item of data.records){
              const id=item.story_id;
              if(!/^T1-0(?:0[1-9]|1[0-2])$/.test(id))throw Error('unexpected story ID '+id);
              fs.writeFileSync('/tmp/t1-first12-evidence/'+id+'.json',JSON.stringify(item.review));
              count++;
            }
          }
          if(count!==12)throw Error('expected 12 evidence records, saw '+count);
          NODE
          failed=0
          for n in $(seq 1 12); do
            id=$(printf 'T1-%03d' "$n")
            if node scripts/check-story-production.mjs audit "$id" --evidence "/tmp/t1-first12-evidence/$id.json" > "/tmp/t1-first12-evidence/$id.result" 2> "/tmp/t1-first12-evidence/$id.err"; then
              echo "$id evidence PASS"
            else
              echo "$id evidence FAIL"
              cat "/tmp/t1-first12-evidence/$id.err"
              head -c 2500 "/tmp/t1-first12-evidence/$id.result" || true
              failed=$((failed+1))
            fi
          done
          echo "First-12 evidence: $((12-failed))/12 passed"
          test "$failed" -eq 0
