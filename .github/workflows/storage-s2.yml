name: S2 storage acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [analysis, acceptance]
        default: analysis
permissions:
  contents: read
  actions: read
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        difficulty: [easy, normal, hard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: t4-three-year-${{ matrix.difficulty }}
          path: work/source
          run-id: ${{ matrix.difficulty == 'easy' && '41971561739' || '41971866724' }}
          github-token: ${{ github.token }}
      - if: inputs.phase == 'analysis'
        run: node --max-old-space-size=6144 --expose-gc scripts/save-capacity.js attribute work/source
      - if: inputs.phase == 'acceptance'
        run: node --max-old-space-size=6144 --expose-gc scripts/storage-s2.js work/source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-${{ inputs.phase }}-${{ matrix.difficulty }}
          path: work/source/s2-*.json
          if-no-files-found: error
