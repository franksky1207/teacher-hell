name: 18-B3 isolated three-scenario test
on:
  push:
    branches:
      - feat/18b2-three-causal-pilots
    paths:
      - .github/workflows/phase18b3-targeted.yml
permissions:
  contents: read
jobs:
  three-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Run only 18-B3 three cases
        run: node --test test/18b2-causal-pilots.test.js
