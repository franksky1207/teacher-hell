name: Publish AVG story workbench preview
on:
  push:
    branches: [content/events-production-v1]
    paths:
      - '.github/workflows/story-avg-preview-publish.yml'
      - 'src/runtime/story-preview-content.js'
      - 'src/runtime/story-performance.js'
      - 'scripts/deploy-preview.sh'
      - 'web/game.js'
      - 'web/story-performance-preview.js'
      - 'web/story-preview-picker.js'
      - 'web/story-preview-cast.js'
      - 'web/story-view.css'
      - 'test/story-preview-picker.test.js'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: teacher-hell-preview-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install build tools
        run: npm ci --ignore-scripts
      - name: Focused AVG checks only
        run: |
          node --check web/game.js
          node --check web/story-performance-preview.js
          node --check web/story-preview-picker.js
          node --test test/story-preview-catalog-playback.test.js test/story-preview-picker.test.js test/story-preview-multipage.test.js test/story-preview-t1-006-010.test.js
      - name: Regenerate approved shared portrait calibration
        run: |
          python -m pip install --quiet Pillow numpy
          python scripts/portrait-calibration.py
      - name: Publish only the preview subtree from the story branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/deploy-preview.sh
      # GITHUB_TOKEN pushes do not start a legacy Pages build. Request it explicitly.
      - name: Request Pages build for the published subtree
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify current versioned preview resources
        run: |
          git fetch origin gh-pages
          version="$(git rev-parse --short=12 HEAD)"
          git cat-file -e "FETCH_HEAD:preview/assets/$version/web/game.js"
          git cat-file -e "FETCH_HEAD:preview/assets/$version/web/story-preview-picker.js"
          git cat-file -e "FETCH_HEAD:preview/web/assets/characters/students/student-001/student-001-full-sheet-uniform-summer.png"
          test "$(git ls-tree FETCH_HEAD .nojekyll | wc -l)" -eq 1
          test "$(git ls-tree FETCH_HEAD:preview index.html | wc -l)" -eq 1
          echo "Verified AVG preview $version"
