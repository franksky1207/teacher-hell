name: Story tooling checks
on:
  push:
    branches: [content/events-production-v1]
    paths: &tooling
      - '.github/workflows/story-production-v1-focused.yml'
      - '.nvmrc'
      - 'package.json'
      - 'scripts/*story*'
      - 'story-reader/**'
      - 'test/story-*.test.js'
      - 'web/story-preview-picker.js'
      - 'web/story-performance-preview.js'
      - 'web/game.js'
      - 'web/story-view.css'
      - 'data/story-production-selected-seeds-T1-001-030.json'
      - 'docs/事件四數值三層平衡種子2400組.md'
      - 'docs/T1-T6-特定故事20主題與觸發日期.md'
      - 'src/calendar/**'
      - 'src/runtime/story-preview-content.js'
      - 'src/runtime/story-performance.js'
  pull_request:
    branches: [main, content/events-production-v1]
    paths:
      - '.github/workflows/story-production-v1-focused.yml'
      - 'content/events-v1/**'
      - 'docs/**'
      - 'scripts/*story*'
      - 'story-reader/**'
      - 'test/story-*.test.js'
      - 'src/runtime/story-preview-content.js'
      - 'src/runtime/story-performance.js'
      - 'web/story-*.js'
      - 'web/story-*.css'
      - 'package.json'
      - '.nvmrc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  story-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: |
          node --check story-reader/reader.js
          node --test test/story-preview-catalog-playback.test.js test/story-draft-validator.test.js test/story-state-matrix.test.js test/story-reader-export.test.js test/story-reader-ui.test.js test/story-production-catalog.test.js test/story-preview-multipage.test.js test/story-preview-snapshot.test.js test/story-preview-cast-continuity.test.js test/story-preview-t1-006-010.test.js test/story-preview-t1-061-072.test.js test/story-preview-t1-073-084.test.js test/story-preview-t1-085-114.test.js test/story-preview-t1-115-126.test.js test/story-preview-t1-127-150.test.js test/story-preview-t1-151-174.test.js test/story-preview-t1-cross-day-pools.test.js test/story-preview-t2-001-030.test.js test/story-preview-t2-031-042.test.js test/story-preview-t3-001-030.test.js test/story-preview-t3-043-066.test.js test/story-preview-picker.test.js
      - name: Verify T4-025–054 full drafts and formal evidence
        shell: bash
        run: |
          set -euo pipefail
          root="content/events-v1/T/T4-高二下/T4-2-畢業旅行行前安排/活動前"
          for n in $(seq 25 54); do
            printf -v id "T4-%03d" "$n"
            node scripts/check-story-draft.mjs --input "$root/$id.md" --stage full
            node scripts/check-story-production.mjs audit "$id" --evidence "$root/驗收紀錄/evidence/$id.json"
          done
      - name: Verify T4-001–024 full drafts and formal evidence
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 24); do
            printf -v id "T4-%03d" "$n"
            root="content/events-v1/T/T4-高二下/T4-1-第二次升學輔導與大學博覽會"
            if (( n <= 12 )); then phase="活動前"; else phase="活動後"; fi
            node scripts/check-story-draft.mjs --input "$root/$phase/$id.md" --stage full
            node scripts/check-story-production.mjs audit "$id" --evidence "$root/活動後/驗收紀錄/evidence/$id.json"
          done
      - name: Verify T3-067–090 post-event full drafts and formal evidence
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 67 90); do
            printf -v id "T3-%03d" "$n"
            root="content/events-v1/T/T3-高二上/T3-2-高二校慶擺攤/活動後"
            node scripts/check-story-draft.mjs --input "$root/$id.md" --stage full
            node scripts/check-story-production.mjs audit "$id" --evidence "$root/驗收紀錄/evidence/$id.json"
          done
      - name: Verify T3-043–066 pre-event formal evidence
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 43 66); do
            printf -v id "T3-%03d" "$n"
            evidence="content/events-v1/T/T3-高二上/T3-2-高二校慶擺攤/活動前/驗收紀錄/evidence/${id}.json"
            node scripts/check-story-production.mjs audit "$id" --evidence "$evidence"
          done
      - name: Verify T3-001–030 pre-event formal evidence
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 30); do
            printf -v id "T3-%03d" "$n"
            evidence="content/events-v1/T/T3-高二上/T3-1-英文歌曲比賽前後/活動前/驗收紀錄/evidence/${id}.json"
            node scripts/check-story-production.mjs audit "$id" --evidence "$evidence"
          done
      - name: Verify T3-031–042 after-event formal evidence
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 31 42); do
            printf -v id "T3-%03d" "$n"
            evidence="content/events-v1/T/T3-高二上/T3-1-英文歌曲比賽前後/活動後/驗收紀錄/evidence/${id}.json"
            node scripts/check-story-production.mjs audit "$id" --evidence "$evidence"
          done
      - name: Verify T2-031–042 after-event formal evidence
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 31 42); do
            printf -v id "T2-%03d" "$n"
            evidence="content/events-v1/T/T2-高一下/T2-1-班呼／校歌比賽前後/活動後/驗收紀錄/evidence/${id}.json"
            node scripts/check-story-production.mjs audit "$id" --evidence "$evidence"
          done
      - name: Verify T2-001–030 revised evidence
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 30); do
            printf -v id "T2-%03d" "$n"
            evidence="content/events-v1/T/T2-高一下/T2-1-班呼校歌比賽前後/活動前/驗收紀錄/evidence/${id}.json"
            node scripts/check-story-production.mjs audit "$id" --evidence "$evidence"
          done

      - name: Verify T5-001–012 Teacher's Day full drafts and formal evidence
        shell: bash
        run: |
          set -euo pipefail
          root="content/events-v1/T/T5-高三上/T5-1-高三教師節活動"
          for n in $(seq 1 12); do
            printf -v id "T5-%03d" "$n"
            if (( n <= 6 )); then phase="活動前"; else phase="活動後"; fi
            file="$root/$phase/$id.md"
            evidence="$root/$phase/驗收紀錄/正式審查證據/$id.json"
            node scripts/check-story-draft.mjs --input "$file" --stage full
            node scripts/check-story-production.mjs audit "$id" --evidence "$evidence"
          done
