name: 18-B editorial evidence hash check
on:
  push:
    branches: [feat/18b-c-t01-t02-integration]
    paths:
      - '.github/workflows/phase18b-evidence-hashes.yml'
      - 'test/18b-current-version-evidence.test.js'
      - 'test/18b-controller-content-disposition.test.js'
      - 'work/18b-t01-t02-controller-content-disposition.json'
      - 'docs/reviews/18b-t01-eight-independent-approval.json'
      - 'work/18b-t01-**'
      - 'work/18b-t02-**'
      - 'work/18b-global-event-isolation.json'
permissions:
  contents: read
jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify only existing independent approval, reviewed-unchanged and isolation hashes
        run: node --test test/18b-current-version-evidence.test.js test/18b-controller-content-disposition.test.js
