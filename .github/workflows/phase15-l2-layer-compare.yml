name: 15-B-L2 scoped visual-layer checks
on:
  push:
    branches: [feat/phase15-l2-layer-compare-20261107]
    paths:
      - .github/workflows/phase15-l2-layer-compare.yml
      - scripts/face-layer-l1.py
      - scripts/face-layer-l2.py
      - artwork/prototypes/student-001-layer-compare.html
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: phase15-l2-layer-compare
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder only
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify face-region reconstruction RGB and alpha
        run: python scripts/face-layer-l1.py
      - name: Validate comparison page JavaScript, images, layout contracts and sizes
        run: python scripts/face-layer-l2.py
      - name: Retain deterministic L1/L2 checks on development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artwork/prototypes/l1-face-layers/ artwork/prototypes/l2-layer-compare/
          if ! git diff --cached --quiet; then
            git commit -m "test(15-B-L2): retain precise reconstruction and comparison result"
            git push origin HEAD:refs/heads/feat/phase15-l2-layer-compare-20261107
          fi
