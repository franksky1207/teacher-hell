name: T1-002-to-006 one-time V3 production acceptance
on:
  push:
    branches: [content/events-production-v1]
    paths:
      - .github/workflows/story-t1-002-006-once.yml
permissions:
  contents: write
concurrency:
  group: five-story-formal-lock
  cancel-in-progress: false
jobs:
  five-stories:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Targeted five-story validation, isolated rehearsal, then formal commit
        shell: bash
        run: |
          set -euo pipefail
          BASE='content/events-v1/正式成品/T/T1-高一上/T1-1-首次進班與建班/單一池'
          ids=(0002 0003 0004 0005 0006)
          seeds=(S0378 S0218 S0417 S1996 S1360)
          dates=(2026-07-20 2026-07-20 2026-07-20 2026-07-20 2026-07-21)
          # Every complete draft must pass all mechanical stages before touching any ledger.
          for id in "${ids[@]}"; do
            story="$BASE/T-DRAFT-$id.md"
            node scripts/check-story-draft.mjs --input "$story" --stage summary
            node scripts/check-story-draft.mjs --input "$story" --stage choices
            node scripts/check-story-draft.mjs --input "$story" --stage full
          done
          node --test test/story-reader-export.test.js test/story-reader-ui.test.js
          node scripts/manage-story-production.mjs audit
          cp data/story-production-ledger.json "$RUNNER_TEMP/five-stories-isolated.json"
          # Rehearsal is a real CLI state transition on a separate isolated ledger.
          for phase in isolated formal; do
            if [[ "$phase" == isolated ]]; then
              extra=(--ledger "$RUNNER_TEMP/five-stories-isolated.json")
            else
              extra=()
            fi
            rev=3
            for i in 0 1 2 3 4; do
              id="${ids[$i]}"
              ref="T-DRAFT-$id"
              story="$BASE/$ref.md"
              review="$BASE/$ref.review.json"
              seed="${seeds[$i]}"
              day="${dates[$i]}"
              node scripts/manage-story-production.mjs propose --ref "$ref" --owner ChatGPT --file "$story" --date "$day" "${extra[@]}" --apply --expect-revision "$rev"
              rev=$((rev+1))
              node scripts/manage-story-production.mjs reserve --ref "$ref" --owner ChatGPT --seed "$seed" --reason "保留種子對應本篇首次建班制度困境，四碼各由兩位合法學生獨立承擔實質反應" "${extra[@]}" --apply --expect-revision "$rev"
              rev=$((rev+1))
              node scripts/manage-story-production.mjs lock --ref "$ref" --owner ChatGPT --file "$story" --review "$review" "${extra[@]}"
              node scripts/manage-story-production.mjs lock --ref "$ref" --owner ChatGPT --file "$story" --review "$review" "${extra[@]}" --apply --expect-revision "$rev"
              rev=$((rev+1))
            done
            node scripts/manage-story-production.mjs audit "${extra[@]}"
            node scripts/manage-story-production.mjs status "${extra[@]}"
            [[ "$rev" -eq 18 ]]
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/story-production-ledger.json
          git diff --cached --quiet && { echo 'FAIL: ledger unchanged'; exit 1; }
          git commit -m 'Lock T1-002 through T1-006 V3 stories after five-story batch acceptance'
          git push origin HEAD:content/events-production-v1
