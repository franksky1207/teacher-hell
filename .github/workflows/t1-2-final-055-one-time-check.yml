name: T1-2 final T1-055 scoped acceptance
on:
  push:
    branches: [content/events-production-v1]
    paths: ['.github/workflows/t1-2-final-055-one-time-check.yml']
permissions:
  contents: read
jobs:
  one-story-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify T1-055 current Git blob and stored review
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const root='content/events-v1/T/T1-高一上/T1-2-高中新生適應/';
          const obj=JSON.parse(fs.readFileSync(root+'驗收紀錄/T1-051-055-正式驗收紀錄.json','utf8'));
          const x=obj.records.find(a=>a.story_id==='T1-055');
          if(!x)throw Error('missing review');
          const actual=execFileSync('git',['hash-object',root+'單一池/T1-055.md'],{encoding:'utf8'}).trim();
          if(actual!==x.source_blob_sha)throw Error('stale story review');
          fs.writeFileSync('/tmp/T1-055.json',JSON.stringify(x.review));
          console.log('T1-055 source blob matches current review');
          NODE
          node scripts/check-story-production.mjs audit T1-055 --evidence /tmp/T1-055.json > /tmp/t1-055-result.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('/tmp/t1-055-result.json','utf8'));
          const x=r.reports.find(x=>x.storyId==='T1-055');
          console.log('T1-055 CLI mechanical='+x?.mechanicalPass+' reviewEvidenceChecked='+r.reviewEvidenceChecked+' catalog issues='+r.issues.length);
          if(!x?.mechanicalPass||!r.reviewEvidenceChecked||r.issues.length)process.exitCode=1;
          NODE
