name: Publish verified 15-C art preview
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase13-preview-publish.yml
      - web/full-sheet-preview.js
      - web/art-preview.js
      - web/background-preview.js
      - web/background-scenes.js
      - web/assets/backgrounds/**
      - web/npc-silhouette-preview.js
      - web/student-portrait-calibration.js
      - web/story-portraits.js
      - scripts/portrait-calibration.py
      - scripts/deploy-preview.sh
      - web/student-portrait-layout.js
      - web/story-scene.js
      - web/game.js
      - web/story-view.css
      - docs/15-C-背景圖SOP.md
      - web/assets/characters/students/**
      - web/assets/characters/adults/**
      - test/student-art-preview.test.js
permissions:
  contents: write
concurrency:
  group: teacher-hell-preview-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate shared final portrait calibration from the approved PNG pixels
        run: |
          python -m pip install --quiet Pillow numpy
          python scripts/portrait-calibration.py
      - name: Verify preview source before publication
        run: |
          npm run check
          node --test --test-isolation=none test/year-result.test.js test/notebook-tasks.test.js test/notebook-view.test.js test/notebook-people.test.js test/student-art-preview.test.js test/story-view.test.js
      - name: Configure automated publication identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish preview directory only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy-preview.sh
      - name: Verify published preview tree preserves Pages root
        run: |
          git fetch origin gh-pages
          test "$(git ls-tree FETCH_HEAD .nojekyll | wc -l)" -eq 1
          test "$(git ls-tree FETCH_HEAD preview | wc -l)" -eq 1
          test "$(git ls-tree FETCH_HEAD:preview index.html | wc -l)" -eq 1
          test "$(git ls-tree FETCH_HEAD:preview web/game.js | wc -l)" -eq 1
          version="$(git rev-parse --short=12 HEAD)"
          git cat-file -e "FETCH_HEAD:preview/web/assets/characters/students/student-001/student-001-full-sheet-uniform-summer.png"
          git cat-file -e "FETCH_HEAD:preview/assets/$version/web/game.js"
          test -z "$(git ls-tree -r --name-only FETCH_HEAD "preview/assets/$version/web/assets/characters/students")"
          echo "PASS: shared original PNGs intact; versioned module graph contains no duplicate student PNGs"
